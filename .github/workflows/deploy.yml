name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  zero-business-vocabulary-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Verify configuration-driven template engine
        working-directory: Backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          REDIS_HOST: 127.0.0.1
          AUTO_MIGRATE: false
          RAG_ENABLED: false
        run: npm run verify:zero-business-vocabulary-release

  deploy:
    needs: zero-business-vocabulary-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/zea-voice-app
            git pull origin main
            export DEPLOY_GIT_SHA="$(git rev-parse HEAD)"
            docker compose up -d --build --remove-orphans
            attempt=0
            until docker exec zea-voice-backend node -e "fetch('http://127.0.0.1:1112/health/release').then(async r=>{if(!r.ok)process.exit(1);const x=(await r.json()).release;if(!x||x.gitSha!==process.env.DEPLOY_GIT_SHA||!x.versions||Object.keys(x.versions).length===0)process.exit(1)}).catch(()=>process.exit(1))"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 30 ]; then
                docker logs --tail 200 zea-voice-backend
                exit 1
              fi
              sleep 2
            done
            docker logs --tail 200 zea-voice-backend | grep -F "$DEPLOY_GIT_SHA"
